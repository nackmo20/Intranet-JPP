(function(EAFC){
  function validateExport(state){const errors=[],warnings=[]; const selected=state.pages.filter(p=>!p.removed); selected.forEach(p=>{if(state.workflow!=='create'&&!p.nodeId) errors.push({target:p.canonicalId,message:'Node ID obligatoire pour une mise à jour'}); if(state.workflow==='create'){if(!p.titleDrupal&&!p.titleSource) errors.push({target:p.canonicalId,message:'titre obligatoire'}); if(!p.thematics?.length) errors.push({target:p.canonicalId,message:'thématique de création obligatoire'}); if(!p.publics?.length) errors.push({target:p.canonicalId,message:'public de création obligatoire'});} if(p.departments?.length===2===false && /\//.test(p.titleDrupal||'')) warnings.push({target:p.canonicalId,message:'vérifier les départements bidépartementaux'});}); const ops=collectOperations(state); if(ops.some(o=>!o.op||o.op==='ignore')) errors.push({message:'opération vide ou ignorée dans la sélection'}); const dup=new Set(); ops.forEach(o=>{const k=`${o.targetId}|${o.field}`; if(dup.has(k)) errors.push({message:`deux opérations sur ${k}`}); dup.add(k);}); return {errors,warnings,blocking:errors.length>0,operations:ops.length,pages:selected.length};}
  function collectOperations(state){const ops=[]; state.pages.filter(p=>!p.removed).forEach(p=>{(p.operations||[]).filter(o=>o.selected!==false&&o.op!=='ignore').forEach(o=>{ops.push(EAFC.diff.removeEmpty({operationId:o.operationId||o.id||EAFC.model.uid('op'),targetId:p.canonicalId,field:o.field,op:o.op||o.operation,value:o.value??o.exportedValue??o.futureValue,expectedBefore:o.expectedBefore??o.currentValue,expectedAfter:o.expectedAfter??o.futureValue,provenance:o.provenance||EAFC.model.provenance(o.source||'MANUAL','',o.field,o.confidence||.7),retry:{max:2}}));});}); return ops.filter(o=>o.targetId&&o.field&&o.op&&Object.keys(o).length);}
  function buildJob(state){const jobId=state.jobId||EAFC.model.uid('job'); const workflowMap={create:'create',update_content:'update_content',update_sofia:'update_sofia',update_taxonomy:'update_taxonomy'}; const targets=state.pages.filter(p=>!p.removed).map(p=>EAFC.diff.removeEmpty({canonicalId:p.canonicalId,nodeId:p.nodeId,url:p.urlDrupal,intentionId:p.intentionId,excelOrigin:p.excelOrigin,resolved:!!(p.nodeId||state.workflow==='create'),provenance:p.provenance?.titleDrupal||EAFC.model.provenance('MANUAL')})); const job=EAFC.diff.removeEmpty({schemaVersion:'2.0',jobId,generatedAt:new Date().toISOString(),studioVersion:EAFC.VERSION,sources:state.sources.map(s=>({kind:s.type,name:s.name,fingerprint:s.fingerprint,priority:50})),safety:{safeMode:state.safeMode,stopOnConflict:true,confirmClicks:state.confirmClicks,simulation:state.simulation},workflow:workflowMap[state.workflow]||state.workflow,targets,operations:collectOperations(state),expectedReport:{schemaVersion:'2.0',jobId},inventoryUpdate:{sourceWorkbook:state.workbook?.originalFileName||'',historyAppendOnly:true},history:state.history}); return job;}
  function downloadJob(state){const job=buildJob(state); const blob=new Blob([JSON.stringify(job,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`eafc-drupal-job-v2-${new Date().toISOString().slice(0,10)}-${job.jobId}.json`; a.click(); URL.revokeObjectURL(a.href); return job;}
  EAFC.job={validateExport,collectOperations,buildJob,downloadJob};
})(window.EAFC=window.EAFC||{});

(function(EAFC){
  const KEY='eafc-studio-v2-workspace';
  function initial(){return {type:'studio_workspace_v2',version:'2.0',jobId:EAFC.model.uid('job'),workflow:'create',sources:[],pages:[],matches:[],manualRejections:{},selectedPageId:'',workbook:null,history:[],undo:[],redo:[],safeMode:true,confirmClicks:true,simulation:false,advanced:false,updatedAt:new Date().toISOString()};}
  let state=initial();
  function snapshot(){return JSON.stringify({...state,undo:[],redo:[]});}
  function push(action){state.undo.push(snapshot()); state.redo=[]; state.history.push({id:EAFC.model.uid('act'),at:new Date().toISOString(),action}); state.updatedAt=new Date().toISOString(); save();}
  function mutate(action,fn){push(action); fn(state); save(); EAFC.ui?.render();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){console.warn('Autosave impossible',e);}}
  function load(){try{const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(initial(),JSON.parse(raw));}catch(e){console.warn('Workspace illisible',e);} return state;}
  function set(next){state=Object.assign(initial(),next); save(); return state;}
  function get(){return state;}
  function undo(){if(!state.undo.length)return; state.redo.push(snapshot()); state=Object.assign(initial(),JSON.parse(state.undo.pop())); save(); EAFC.ui?.render();}
  function redo(){if(!state.redo.length)return; state.undo.push(snapshot()); state=Object.assign(initial(),JSON.parse(state.redo.pop())); save(); EAFC.ui?.render();}
  function exportWorkspace(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`studio-eafc-workspace-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);}
  EAFC.workspace={initial,get,set,load,save,mutate,undo,redo,exportWorkspace};
})(window.EAFC=window.EAFC||{});

(function(EAFC){
  const steps=['Sources','Correspondances','Modifications','Prévisualisation','Contrôles','Export','Rapport'];
  function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function mount(){EAFC.workspace.load(); document.body.innerHTML=`<div id="app"></div>`; render();}
  function render(){const s=EAFC.workspace.get(), checks=EAFC.job.validateExport(s), selected=s.pages.find(p=>p.canonicalId===s.selectedPageId)||s.pages.find(p=>!p.removed)||null; document.getElementById('app').innerHTML=`<header><div><h1>Studio Intranet EAFC v2</h1><p>Préparation locale des créations et mises à jour Drupal — aucune donnée transmise.</p></div><div class="top-actions"><button id="resume">Reprendre</button><button id="importReport">Importer un rapport Drupal</button><button id="inventory">Actualiser le recensement</button><button id="advanced">${s.advanced?'Mode simple':'Options avancées'}</button><button id="history">Historique</button></div></header>${home(s)}${stepper(checks)}${dropZone(s)}<main>${centralTable(s,checks)}${sidePanel(selected,s,checks)}</main>${footer(s,checks)}`; bind();}
  function home(s){const cards=[['create','Créer de nouvelles pages','Préparer des pages Drupal depuis les intentions OVP.'],['update_content','Mettre à jour des pages existantes','Comparer les demandes de modification avec le recensement.'],['update_sofia','Actualiser les informations Sofia-FMO','Dates, sessions, modalités, lieux, places et liens de préinscription.'],['update_taxonomy','Modifier les thématiques et les publics','Modifications unitaires ou massives des taxonomies Drupal.']]; return `<section class="cards">${cards.map(c=>`<button class="card ${s.workflow===c[0]?'active':''}" data-workflow="${c[0]}"><h2>${c[1]}</h2><p>${c[2]}</p></button>`).join('')}</section>`;}
  function stepper(checks){return `<nav class="steps">${steps.map((st,i)=>`<span class="step ${i===0?'current':''} ${i<2?'done':''} ${checks.blocking&&i>=4?'blocked':''}">${i+1}. ${st}</span>`).join('')}</nav>`;}
  function dropZone(s){return `<section class="drop" id="drop"><input id="fileInput" type="file" multiple webkitdirectory directory hidden><h2>Import universel</h2><p>Glissez-déposez JSON, CSV, HTML, XLS/XLSX ou dossier OVP ici, ou <button id="browse">choisir des fichiers</button>.</p><table><thead><tr><th>Type</th><th>Nom</th><th>Date</th><th>Taille</th><th>Lignes</th><th>Feuilles</th><th>Statut</th><th>Avertissements</th><th>Empreinte</th></tr></thead><tbody>${s.sources.map((f,i)=>`<tr><td><select data-type-index="${i}">${typeOptions(f.type)}</select></td><td>${h(f.name)}</td><td>${h(f.date)}</td><td>${Math.round((f.size||0)/1024)} Ko</td><td>${f.rows||0}</td><td>${f.sheets||0}</td><td>${h(f.status)}</td><td>${h((f.warnings||[]).join('; '))}</td><td><code>${h((f.fingerprint||'').slice(0,16))}</code></td></tr>`).join('')||'<tr><td colspan="9">Aucune source importée.</td></tr>'}</tbody></table></section>`;}
  function typeOptions(type){return ['json_ovp','excel_inventory','excel_request','excel_sofia_plan','bi_rana','legacy_drupal_sofia_mapping','legacy_create_payload','legacy_update_payload','legacy_taxonomy_payload','drupal_report','studio_workspace','unknown'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('');}
  function centralTable(s,checks){const pages=s.pages.filter(p=>!p.removed); return `<section class="work"><div class="toolbar"><input id="search" placeholder="Recherche"><button id="undo">Annuler</button><button id="redo">Rétablir</button><button id="bulkAdd">Action massive: sélectionner différences</button><button id="exportWs">Exporter espace</button></div><p><strong>${pages.length}</strong> pages concernées — <strong>${checks.operations}</strong> opérations — <strong>${checks.errors.length}</strong> erreurs — <strong>${checks.warnings.length}</strong> alertes.</p><table class="grid"><thead><tr><th>Sélection</th><th>Statut</th><th>Confiance</th><th>Intention</th><th>Page Drupal</th><th>Node ID</th><th>Département</th><th>Dispositif</th><th>Module</th><th>Différences</th><th>Erreurs</th><th>Avertissements</th><th></th></tr></thead><tbody>${pages.map(p=>`<tr class="${s.selectedPageId===p.canonicalId?'selected':''}" data-row="${p.canonicalId}"><td><input type="checkbox" ${p.selected!==false?'checked':''} data-select="${p.canonicalId}"></td><td>${h(p.status)}</td><td>${Math.round((p.confidence||0)*100)}%</td><td>${h(p.intentionId)}</td><td>${h(p.titleDrupal||p.titleSource)}</td><td>${h(p.nodeId)}</td><td>${h((p.departments||[]).join('/'))}</td><td>${h(p.dispositifCode)}</td><td>${h((p.moduleCodes||[]).join(', '))}</td><td>${(p.operations||[]).filter(o=>o.selected!==false).length}</td><td>${p.errors?.length||0}</td><td>${p.warnings?.length||0}</td><td><button data-remove="${p.canonicalId}">Retirer</button></td></tr>`).join('')||'<tr><td colspan="13">Importez des sources pour alimenter le modèle canonique.</td></tr>'}</tbody></table></section>`;}
  function sidePanel(p,s,checks){if(!p)return `<aside><h2>Fiche latérale</h2><p>Aucune page sélectionnée.</p></aside>`; return `<aside><h2>${h(p.titleDrupal||p.titleSource)}</h2><dl><dt>Sources</dt><dd>${h(s.sources.map(x=>x.name).join(', '))}</dd><dt>Valeurs actuelles</dt><dd>${h(JSON.stringify({nodeId:p.nodeId,url:p.urlDrupal,thematics:p.thematics,publics:p.publics},null,2))}</dd><dt>Valeurs demandées</dt><dd>${h(JSON.stringify((p.operations||[]).map(o=>({field:o.field,op:o.op||o.operation,value:o.value||o.futureValue})),null,2))}</dd><dt>Historique</dt><dd>${h((p.history||[]).map(x=>x.action).join(' → '))}</dd></dl><h3>Prévisualisation</h3>${preview(p,s.workflow)}<h3>Opérations</h3>${operationEditor(p)}<h3>Contrôles</h3><ul>${checks.errors.concat(checks.warnings).filter(e=>!e.target||e.target===p.canonicalId).map(e=>`<li>${h(e.message)}</li>`).join('')||'<li>Pas de blocage connu.</li>'}</ul></aside>`;}
  function preview(p,wf){return `<article class="preview"><h4>${h(p.titleDrupal||p.titleSource)}</h4><p><strong>Chapo:</strong> ${h((p.content||'').slice(0,220))}</p><p><strong>Image prévue:</strong> Bannière aléatoire (Agent Drupal)</p><p><strong>Thématiques:</strong> ${h((p.thematics||[]).join(', '))}</p><p><strong>Publics:</strong> ${h((p.publics||[]).join(' | '))}</p><p><strong>Géographie:</strong> ${h((p.departments||[]).join('/'))||'Académie'}</p><p><strong>Dates:</strong> ${h(JSON.stringify(p.dates||{}))}</p><div class="html-preview">${h(p.content||'HTML principal à générer')}</div><p>Lien retour: Retour à la page Ma formation.</p><p class="tech">ID canonique ${h(p.canonicalId)} — workflow ${h(wf)}</p></article>`;}
  function operationEditor(p){return `<div>${(p.operations||[]).map((o,i)=>`<label><input type="checkbox" data-op-select="${p.canonicalId}|${i}" ${o.selected!==false?'checked':''}> ${h(o.field)} <select data-op-kind="${p.canonicalId}|${i}">${['add','remove','replace','clear','delete'].map(k=>`<option ${k===(o.op||o.operation)?'selected':''}>${k}</option>`).join('')}</select> <input data-op-value="${p.canonicalId}|${i}" value="${h(o.value??o.futureValue??'')}"></label>`).join('')||'<p>Aucune opération. Les cellules vides sont ignorées.</p>'}</div>`;}
  function footer(s,checks){return `<footer><button id="runControls">Contrôles</button><button id="exportJob" ${checks.blocking?'disabled':''}>Exporter Job v2</button><button id="exportInventory">Exporter copie recensement</button><details><summary>Rapport de couverture matrice</summary><p>Fonctionnalités Studio couvertes par l’implémentation initiale: import universel, Excel structurel, modèle canonique, matching, différences, taxonomies, workspace, export Job v2, recensement versionné.</p></details></footer>`;}
  function bind(){document.querySelectorAll('[data-workflow]').forEach(b=>b.onclick=()=>EAFC.workspace.mutate('workflow',s=>s.workflow=b.dataset.workflow)); document.getElementById('advanced').onclick=()=>EAFC.workspace.mutate('toggle_advanced',s=>s.advanced=!s.advanced); document.getElementById('browse').onclick=()=>document.getElementById('fileInput').click(); document.getElementById('fileInput').onchange=e=>handleFiles(e.target.files); const dz=document.getElementById('drop'); dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')}; dz.ondragleave=()=>dz.classList.remove('over'); dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFiles(e.dataTransfer.files)}; document.querySelectorAll('[data-row]').forEach(r=>r.onclick=e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return; EAFC.workspace.mutate('select_page',s=>s.selectedPageId=r.dataset.row)}); document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>EAFC.workspace.mutate('remove_page',s=>{const p=s.pages.find(x=>x.canonicalId===b.dataset.remove); if(p)p.removed=true;})); document.getElementById('undo').onclick=EAFC.workspace.undo; document.getElementById('redo').onclick=EAFC.workspace.redo; document.getElementById('exportWs').onclick=EAFC.workspace.exportWorkspace; document.getElementById('exportJob').onclick=()=>EAFC.job.downloadJob(EAFC.workspace.get()); document.getElementById('exportInventory').onclick=async()=>{const st=EAFC.workspace.get(); const blob=await EAFC.excel.exportVersionedCopy(st.workbook,[]); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`recensement-eafc-v2-${new Date().toISOString().slice(0,10)}.json`; a.click();}; document.querySelectorAll('[data-type-index]').forEach(sel=>sel.onchange=()=>EAFC.workspace.mutate('manual_type',s=>s.sources[Number(sel.dataset.typeIndex)].type=sel.value)); document.querySelectorAll('[data-op-select]').forEach(cb=>cb.onchange=()=>setOp(cb.dataset.opSelect,o=>o.selected=cb.checked)); document.querySelectorAll('[data-op-kind]').forEach(sel=>sel.onchange=()=>setOp(sel.dataset.opKind,o=>o.op=sel.value)); document.querySelectorAll('[data-op-value]').forEach(inp=>inp.onchange=()=>setOp(inp.dataset.opValue,o=>o.value=inp.value)); document.getElementById('bulkAdd').onclick=()=>EAFC.workspace.mutate('bulk_select',s=>s.pages.forEach(p=>(p.operations||[]).forEach(o=>o.selected=true)));}
  function setOp(key,fn){EAFC.workspace.mutate('edit_operation',s=>{const [id,i]=key.split('|'); const p=s.pages.find(x=>x.canonicalId===id); if(p&&p.operations[Number(i)])fn(p.operations[Number(i)]);});}
  async function handleFiles(files){for(const file of files){const detected=await EAFC.importers.detectFile(file); detected.file=file; const imported=await EAFC.importers.importDetected(detected); EAFC.workspace.mutate('import_'+detected.type,s=>{s.sources.push({...detected,file:undefined,workbook:undefined}); if(imported.workbook)s.workbook=imported.workbook; if(imported.models?.length){s.pages.push(...imported.models); if(!s.selectedPageId)s.selectedPageId=imported.models[0].canonicalId;} }); await new Promise(r=>setTimeout(r,0));}}
  EAFC.ui={mount,render}; document.addEventListener('DOMContentLoaded',mount);
})(window.EAFC=window.EAFC||{});
</script></body></html>
